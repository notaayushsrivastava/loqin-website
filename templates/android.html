<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Android Not Supported - Loqin PC</title>
    <meta
      name="description"
      content="Loqin PC is currently not available on Android. Download the Windows or macOS installer instead."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='loqin_icon.ico') }}" />
    <style>
      .button-with-logo {
        gap: 0.55rem;
      }

      .button-logo {
        width: 1.05rem;
        height: 1.05rem;
        flex-shrink: 0;
      }

      .button-logo path {
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <div class="backdrop backdrop-one"></div>
    <div class="backdrop backdrop-two"></div>

    <main class="thank-you-main">
      <section class="thank-you-card">
        <a class="brand" href="{{ url_for('index') }}" aria-label="Back to Loqin home">
          <span class="brand-mark" aria-hidden="true"
            ><img src="{{ url_for('static', filename='loqin_logo_small.png') }}" alt=""
          /></span>
          <span class="brand-text"><strong>Loqin</strong><small>PC Wi-Fi Client</small></span>
        </a>

        <p class="eyebrow">Android device detected</p>
        <h1>Android is not supported yet.</h1>
        <p>
          Loqin is currently available only as a desktop app. You can still download installers
          for Windows or macOS below.
        </p>

        <div class="cta-row">
          <a class="button button-primary button-with-logo" href="{{ windows_installer_url }}">
            <svg class="button-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2.7 3.7 11 2.5v8.7H2.7zm9.6-1.4 9-1.3v10.2h-9zM2.7 12.8H11v8.7l-8.3-1.2zm9.6 0h9v10.2l-9-1.3z" />
            </svg>
            <span>Download for Windows</span>
          </a>
          <a class="button button-secondary button-with-logo" href="{{ mac_installer_url }}">
            <svg class="button-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M16.7 12.8c0-2 1.7-3 1.8-3.1-1-1.4-2.5-1.6-3.1-1.6-1.3-.1-2.5.8-3.1.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.9-3.6 2.3-1.6 2.8-.4 6.8 1.1 8.9.7 1 1.6 2.2 2.8 2.1 1.1 0 1.5-.7 2.9-.7 1.3 0 1.7.7 2.9.7 1.2 0 2-1.1 2.7-2.1.8-1.2 1.2-2.3 1.2-2.4-.1 0-2.3-.9-2.3-4.1zM14.6 6.7c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.7 1.3-.6.7-1.1 1.7-1 2.7 1 0 2-.5 2.8-1.3z" />
            </svg>
            <span>Download for macOS</span>
          </a>
          <a class="button button-ghost" href="{{ url_for('index') }}">Back to homepage</a>
        </div>
      </section>
    </main>
  </body>
</html>
